[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-energy"
version = "0.2.0"
description = "Energy systems analysis, renewable energy optimization, and grid management"
readme = "README.md"
license = {text = "CC BY-NC-SA 4.0"}
requires-python = ">=3.11"
authors = [{name = "GEO-INFER Development Team"}]
keywords = ["geospatial", "energy", "renewable-energy", "grid", "solar", "wind"]
dependencies = [
    "numpy>=1.20.0",
    "xarray>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]
