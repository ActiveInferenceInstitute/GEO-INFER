[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-energy"
version = "0.1.0"
description = "Energy systems analysis, renewable energy optimization, and grid management"
readme = "README.md"
license = {text = "CC BY-ND-SA 4.0"}
requires-python = ">=3.9"
authors = [{name = "GEO-INFER Development Team"}]
keywords = ["geospatial", "energy", "renewable-energy", "grid", "solar", "wind"]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "xarray>=0.19.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
