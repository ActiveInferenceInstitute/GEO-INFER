[project]
name = "cascadia"
version = "0.2.0"
description = "Cascadian Agricultural Land Analysis Framework"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "geopandas>=0.10.0",
    "shapely>=2.0.0",
    "pyproj>=3.2.0",
    "rasterio>=1.2.0",
    "fiona>=1.8.0",
    "h3>=4.0.0",
    "requests>=2.25.0",
    "urllib3>=1.26.0",
    "folium>=0.14.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "branca>=0.6.0",
    "jinja2>=3.1.0",
    "pyyaml>=5.4.0",
    "python-dotenv>=0.19.0",
    "scikit-learn>=1.0.0",
    "networkx>=2.6.0",
    "tqdm>=4.62.0",
    "psutil>=5.9.0",
    "selenium>=4.0.0",
    "webdriver-manager>=3.8.0",
    "html5lib>=1.1",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
viz = [
    "contextily>=1.2.0",
    "datashader>=0.14.0",
    "holoviews>=1.15.0",
    "bokeh>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
