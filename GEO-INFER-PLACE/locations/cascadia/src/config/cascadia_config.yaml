    - federal
    - state
    enabled: false
  ownership:
    data_sources:
    - assessor
    - state
    enabled: true
  power_source:
    data_sources:
    - utility
    - state
    enabled: false
  surface_water:
    data_sources:
    - usgs
    - state
    enabled: false
  water_rights:
    data_sources:
    - state
    enabled: false
  zoning:
    data_sources:
    - county
    - state
