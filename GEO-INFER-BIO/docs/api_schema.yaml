# OpenAPI schema for the GEO-INFER-BIO REST API.
#
# Generated from the implemented FastAPI application in
# src/geo_infer_bio/api/rest_api.py — every path below exists in code.
openapi: 3.0.3
info:
  title: GEO-INFER-BIO API
  description: API for biological sequence analysis with spatial context
  version: 0.2.0
paths:
  /:
    get:
      summary: API metadata
      operationId: root
      responses:
        '200':
          description: API name, version, and description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfo'
  /health:
    get:
      summary: Health check
      operationId: health_check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /analyze/sequence:
    post:
      summary: Analyze a single sequence
      operationId: analyze_sequence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SequenceData'
      responses:
        '200':
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
        '400':
          description: Invalid sequence
  /analyze/file:
    post:
      summary: Analyze sequences from an uploaded FASTA file
      operationId: analyze_file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: FASTA file containing sequences
                spatial_data:
                  type: string
                  format: binary
                  description: Optional CSV with latitude/longitude columns
      responses:
        '200':
          description: Per-sequence analysis results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisResultDict'
  /visualize/spatial:
    post:
      summary: Generate spatial visualizations of analysis results
      description: |
        Every result must include spatial_data. Returns base64-encoded PNG
        plots keyed by plot name (gc_content, motif_density, coding_potential).
      operationId: visualize_spatial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AnalysisResult'
      responses:
        '200':
          description: Base64-encoded PNG plots
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                  description: Base64-encoded PNG bytes
        '400':
          description: Missing results or missing spatial_data
components:
  schemas:
    SpatialData:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
        longitude:
          type: number
    SequenceData:
      type: object
      required: [id, sequence]
      properties:
        id:
          type: string
        sequence:
          type: string
        spatial_data:
          $ref: '#/components/schemas/SpatialData'
    AnalysisResult:
      type: object
      required: [sequence_id, gc_content, motif_count, coding_regions]
      properties:
        sequence_id:
          type: string
        gc_content:
          type: number
        motif_count:
          type: integer
        coding_regions:
          type: integer
        spatial_data:
          $ref: '#/components/schemas/SpatialData'
    AnalysisResultDict:
      type: object
      required: [sequence_id, gc_content, motif_count, coding_regions]
      properties:
        sequence_id:
          type: string
        gc_content:
          type: number
        motif_count:
          type: integer
        coding_regions:
          type: integer
        spatial_data:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number
    ApiInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
