# Repository-derived manuscript configuration for GEO-INFER.

paper:
  title: "GEO-INFER: Geospatial Inference Framework"
  subtitle: "An evidence-backed manuscript for a modular spatial inference monorepo"
  version: "0.2.0"  # generator-owned (PROJECT_VERSION)
  date: "2026-09-05T16:08:28-07:00"  # generator-owned (MANUSCRIPT_SOURCE_DATE)

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

publication:
  doi: ""
  version_doi: ""
  version_record: ""
  github_repository: "ActiveInferenceInstitute/GEO-INFER"
  year: "2026"  # generator-owned (MANUSCRIPT_SOURCE_YEAR)
  transmission_bookends:
    enabled: false
    max_prior_releases: 5
    show_steganography: false

keywords:
  - "geospatial inference"
  - "active inference"
  - "spatial analysis"
  - "monorepo validation"
  - "ecological modeling"

metadata:
  license: "CC BY-NC-SA 4.0"  # generator-owned (PROJECT_LICENSE)
  language: "en"

manuscript_dir: "manuscript"

# Layout options consumed by the template renderer. figure_height_fraction is
# the ``height=<fraction>\textheight`` bound applied to every \includegraphics.
# The default 0.50 clamped every figure to half the text block, which scaled the
# 45-row module inventory down to ~3pt type. The generator draws figures at the
# printed size instead (see FIGURE_HEIGHT_FRACTION in
# manuscript/generate_research_artifacts.py, which must match this value).
rendering:
  figure_height_fraction: 0.9
  front_matter_figure_height_fraction: 0.9

render:
  formats:
    pdf: true
    html: true
    slides: true
    docx: false
    epub: false

# Both gates are enforced by manuscript/generate_research_artifacts.py
# (audit_bibliography). No renderer code reads these keys, so before the
# generator honoured them they described a check that did not run.
bibliography:
  references_path: "manuscript/references.bib"
  fail_on_missing: true
  # Set to true once every entry in references.bib is cited. As of this
  # commit gelman_bda_2014 is not, and the generator warns on every run.
  fail_on_unused: false
