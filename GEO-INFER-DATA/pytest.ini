[tool:pytest]
# Pytest configuration for GEO-INFER-DATA

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src/geo_infer_data
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=85

# Markers for different test types
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    performance: Performance tests and benchmarks
    slow: Tests that take longer to run
    database: Tests that require database connections
    network: Tests that require network access
    geospatial: Tests that require geospatial libraries

# Async test configuration
asyncio_mode = auto

# Test data configuration
env =
    GEO_INFER_TESTING=true
    GEO_INFER_DB_HOST=localhost
    GEO_INFER_DB_NAME=geo_infer_test
    MINIO_ENDPOINT=localhost:9000
    REDIS_HOST=localhost

# Coverage configuration
[coverage:run]
source = src/geo_infer_data
omit =
    tests/*
    examples/*
    setup.py
    */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov
