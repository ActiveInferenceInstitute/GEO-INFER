[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-space"
version = "0.1.0"
description = "H3 v4 spatial indexing and comprehensive geospatial analysis framework with advanced spatial methods and coordinate transformations"
readme = "README.md"
license = {text = "CC BY-ND-SA 4.0"}
requires-python = ">=3.9"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = ["geospatial", "active inference", "geoinformatics", "spatial-analysis, h3, geospatial, coordinate-systems, spatial-indexing, geometric-operations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Creative Commons License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "fastapi>=0.68.0",
    "fiona>=1.8.0",
    "geojson-pydantic>=0.4.0",
    "geopandas>=0.10.0",
    "h3>=4.0.0",
    "networkx>=2.6.0",
    "numpy>=1.20.0,<2.0",
    "pandas>=1.3.0",
    "pydantic>=1.8.0",
    "pyproj>=3.3.0",
    "python-multipart>=0.0.5",
    "pyyaml>=6.0",
    "rasterio>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "shapely>=1.8.0",
    "uvicorn>=0.15.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-asyncio>=0.20.0",
    "black>=21.9.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "isort>=5.9.0",
]
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]
optional = [
    "laspy>=2.0.0",
    "osmnx>=1.2.0",
    "xarray>=0.20.0",
    "rioxarray>=0.11.0",
    "numba>=0.56.0",
    "dask>=2021.10.0",
    "dask[dataframe]>=2021.10.0",
    "redis>=4.0.0"
]
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "folium>=0.12.0"
]
all = [
    "laspy>=2.0.0",
    "osmnx>=1.2.0",
    "xarray>=0.20.0",
    "rioxarray>=0.11.0",
    "numba>=0.56.0",
    "dask>=2021.10.0",
    "dask[dataframe]>=2021.10.0",
    "redis>=4.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "folium>=0.12.0",
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0"
]


[project.urls]
Homepage = "https://github.com/geo-infer/geo-infer"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/geo-infer/geo-infer"
"Bug Tracker" = "https://github.com/geo-infer/geo-infer/issues"

[project.scripts]
gis-verify-h3-v4 = "geo_infer_space.tools.verify_h3_v4_compliance:main"
gis-fix-h3-v4 = "geo_infer_space.tools.fix_h3_v4_api:main"
gis-fix-h3-calls = "geo_infer_space.tools.fix_h3_calls:main"
gis-fix-double-h3 = "geo_infer_space.tools.fix_double_h3:main"
gis-fix-imports = "geo_infer_space.tools.fix_imports:main"
gis-fix-rel-imports = "geo_infer_space.tools.fix_relative_imports:main"
gis-h3-tests = "geo_infer_space.tools.run_h3_tests_simple:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["geo_infer_space"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "geopandas.*",
    "h3.*",
    "folium.*",
    "plotly.*",
    "matplotlib.*",
    "scipy.*",
    "sklearn.*",
    "tensorflow.*",
    "torch.*",
    "pymc.*",
    "arviz.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

