[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-water"
version = "0.2.0"
description = "Water resources management, hydrology, and water quality monitoring"
readme = "README.md"
license = {text = "CC BY-NC-SA 4.0"}
requires-python = ">=3.11"
authors = [{name = "GEO-INFER Development Team"}]
keywords = ["geospatial", "water", "hydrology", "water-resources", "water-quality"]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "xarray>=0.19.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]
