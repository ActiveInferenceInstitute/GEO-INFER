[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-health"
version = "0.1.0"
description = "Epidemiology, healthcare accessibility analysis, disease surveillance, and spatial health risk assessment"
readme = "README.md"
license = {text = "CC BY-ND-SA 4.0"}
requires-python = ">=3.9"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = ["geospatial", "active inference", "geoinformatics", "health, epidemiology, accessibility, surveillance, risk-assessment, healthcare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Creative Commons License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "black>=23.12.0",
    "dask>=2023.12.0",
    "esda>=2.5.0",
    "fastapi>=0.104.0",
    "fiona>=1.9.0",
    "flake8>=6.1.0",
    "folium>=0.15.0",
    "geopandas>=0.14.0",
    "httpx>=0.25.0",
    "hypothesis>=6.88.0",
    "isort>=5.13.0",
    "libpysal>=4.9.0",
    "loguru>=0.7.0",
    "matplotlib>=3.8.0",
    "mypy>=1.7.0",
    "networkx>=3.2.0",
    "numpy>=1.24.0",
    "osmnx>=1.8.0",
    "pandas>=2.1.0",
    "plotly>=5.17.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyproj>=3.6.0",
    "pysal>=23.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0.0",
    "rasterio>=1.3.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
    "shapely>=2.0.0",
    "spglm>=1.0.8",
    "spint>=1.0.7",
    "statsmodels>=0.14.0",
    "tensorflow>=2.15.0",
    "torch>=2.1.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "xarray>=2023.12.0",
    "xgboost>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-asyncio>=0.20.0",
    "black>=21.9.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "isort>=5.9.0",
]
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]


[project.urls]
Homepage = "https://github.com/geo-infer/geo-infer"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/geo-infer/geo-infer"
"Bug Tracker" = "https://github.com/geo-infer/geo-infer/issues"

[project.scripts]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["geo_infer_health"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "geopandas.*",
    "h3.*",
    "folium.*",
    "plotly.*",
    "matplotlib.*",
    "scipy.*",
    "sklearn.*",
    "tensorflow.*",
    "torch.*",
    "pymc.*",
    "arviz.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

