openapi: 3.0.3
info:
  title: GEO-INFER-COG API
  description: |
    Cognitive processing and decision support API for geospatial intelligence
    applications, backed by geo_infer_cog.api.rest_api.

    Implemented endpoints cover:
    - Natural language processing (analysis, entity extraction, sentiment)
    - Cognitive reasoning and knowledge extraction
    - Decision support analysis
    - Cognitive pipeline processing and visualization
    - User cognitive profile management
    - System status, metrics, and health
  version: 0.2.0
  contact:
    name: GEO-INFER-COG Support
    email: cog-support@geo-infer.org
  license:
    name: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/

servers:
  - url: http://localhost:8000/cog/v1
    description: Development server

tags:
  - name: nlp
    description: Natural language processing operations
  - name: reasoning
    description: Cognitive reasoning and inference
  - name: knowledge
    description: Knowledge extraction
  - name: decision-support
    description: Decision support systems
  - name: cognitive
    description: Cognitive pipeline processing
  - name: visualization
    description: Cognitively optimized visualization
  - name: profiles
    description: User cognitive profile management
  - name: system
    description: System management and health monitoring

paths:
  /health:
    get:
      tags: [system]
      summary: Health check
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /nlp/analyze:
    post:
      tags: [nlp]
      summary: Analyze text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Text analysis completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /nlp/entities/extract:
    post:
      tags: [nlp]
      summary: Extract spatial entities from text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Entity extraction completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /nlp/sentiment/analyze:
    post:
      tags: [nlp]
      summary: Analyze sentiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Sentiment analysis completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /reasoning/infer:
    post:
      tags: [reasoning]
      summary: Perform spatial reasoning over geometries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spatial_data:
                  type: object
                context:
                  type: object
      responses:
        '200':
          description: Inference completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /knowledge/extract:
    post:
      tags: [knowledge]
      summary: Extract knowledge from spatial data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_data:
                  type: object
                extraction_type:
                  type: string
                  enum: [entities, relationships]
      responses:
        '200':
          description: Knowledge extraction completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /decision-support/analyze:
    post:
      tags: [decision-support]
      summary: Analyze decision scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario:
                  type: object
                criteria:
                  type: array
                  items: { type: string }
                alternatives:
                  type: array
                  items: { type: object }
      responses:
        '200':
          description: Decision analysis completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /cognitive/process:
    post:
      tags: [cognitive]
      summary: Process spatial data through the cognitive pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spatial_data]
              properties:
                spatial_data:
                  type: object
                context:
                  type: object
                user_profile:
                  type: object
      responses:
        '200':
          description: Processing completed; confidence_score is the mean
            confidence of the produced decisions (0.0 when no decisions)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /visualization/create:
    post:
      tags: [visualization]
      summary: Create cognitively optimized visualization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spatial_data:
                  type: object
                user_profile:
                  type: object
      responses:
        '200':
          description: Visualization specification created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /profiles/{user_id}:
    get:
      tags: [profiles]
      summary: Get a user cognitive profile
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Profile summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResult' }
        '404':
          description: Profile not found
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [profiles]
      summary: Create or update a user cognitive profile
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile created or updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /system/status:
    get:
      tags: [system]
      summary: Component health and status
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResult' }
        '500':
          $ref: '#/components/responses/ServerError'

  /system/metrics:
    get:
      tags: [system]
      summary: Performance metrics
      responses:
        '200':
          description: System metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResult' }
        '500':
          $ref: '#/components/responses/ServerError'

components:
  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    AnalysisResult:
      type: object
      description: Endpoint-specific result payload (see route documentation).
    HealthResponse:
      type: object
      properties:
        status: { type: string }
        timestamp: { type: string }