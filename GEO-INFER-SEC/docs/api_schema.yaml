# OPENAPI SPEC — GENERATED FROM IMPLEMENTATION
#
# GEO-INFER-SEC ships a live HTTP layer: the Flask blueprint in
# src/geo_infer_sec/api/security_api.py, registered by init_security_api()
# at url_prefix="/api/security". Paths below are the six real blueprint
# routes; regenerate this file from that module if the routes change.
# Authentication is JWT Bearer via the token_required decorator (POST
# /token issues tokens; every other route requires them).

openapi: 3.0.3
info:
  title: GEO-INFER-SEC API
  description: |
    Security and privacy protection API for geospatial data security
    management, backed by the live Flask blueprint in
    src/geo_infer_sec/api/security_api.py.

    This API provides:
    - JWT token issuance for authenticated access
    - Role and permission introspection
    - Geospatial data anonymization (location perturbation, spatial k-anonymity)
    - Location access checks and permission-based data filtering
    - Regulatory compliance checking (GDPR et al.)
  version: 1.0.0
  contact:
    name: GEO-INFER Development Team
    email: geo-infer@activeinference.institute
    url: https://github.com/ActiveInferenceInstitute/GEO_INFER
  license:
    name: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/

servers:
  - url: http://localhost:8000
    description: Development server (init_security_api registers the blueprint at /api/security)

security:
  - BearerAuth: []

tags:
  - name: authentication
    description: JWT token issuance
  - name: access-control
    description: Roles, permissions, and location access
  - name: anonymization
    description: Privacy-preserving geospatial data transforms
  - name: compliance
    description: Regulatory compliance checking
  - name: data-filtering
    description: Permission-based geospatial data filtering

paths:
  /api/security/token:
    post:
      tags: [authentication]
      summary: Generate a JWT token for a user
      description: Issues a JWT for a user known to the access manager. Requires the user to have assigned roles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Missing user_id in request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: User has no assigned roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Security API not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/security/roles:
    get:
      tags: [access-control]
      summary: Get all roles assigned to the authenticated user
      description: Requires a valid Bearer token (token_required).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Roles retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesResponse'
        '401':
          description: Missing, invalid, or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Security API not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/security/anonymize:
    post:
      tags: [anonymization]
      summary: Anonymize geospatial data
      description: Applies location perturbation or spatial k-anonymity to a GeoJSON FeatureCollection. Requires a valid Bearer token. Requires the anonymization service to be enabled (enable_anonymization).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnonymizeRequest'
      responses:
        '200':
          description: Anonymization completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymizeResponse'
        '400':
          description: Invalid or missing GeoJSON data, unknown method, or geographic masking requested without admin boundaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Anonymization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Anonymization service not enabled or API not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/security/check-access:
    post:
      tags: [access-control]
      summary: Check if the user has access to a specific location
      description: Requires a valid Bearer token.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAccessRequest'
      responses:
        '200':
          description: Access decision for the location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAccessResponse'
        '400':
          description: Missing location coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/security/check-compliance:
    post:
      tags: [compliance]
      summary: Check data compliance with regulations
      description: Checks a GeoJSON FeatureCollection against the requested compliance regimes (default gdpr). Requires the compliance service to be enabled (enable_compliance).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckComplianceRequest'
      responses:
        '200':
          description: Compliance verdict with violation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckComplianceResponse'
        '400':
          description: Invalid or missing GeoJSON data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Compliance check error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Compliance service not enabled or API not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/security/filter-data:
    post:
      tags: [data-filtering]
      summary: Filter geospatial data based on user permissions
      description: Returns only the features of a GeoJSON FeatureCollection the authenticated user may access.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterDataRequest'
      responses:
        '200':
          description: Filtered dataset with counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterDataResponse'
        '400':
          description: Invalid or missing GeoJSON data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Data filtering error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Security API not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT issued by POST /api/security/token, sent as "Authorization: Bearer <token>".'

  schemas:
    TokenRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
        expiration_hours:
          type: integer
          default: 24
          minimum: 1

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Bearer token
        expires_in:
          type: integer
          description: Token lifetime in seconds
        roles:
          type: array
          items:
            type: string

    RoleInfo:
      type: object
      properties:
        name:
          type: string
        permission_count:
          type: integer
        permissions:
          type: array
          items:
            type: string

    RolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleInfo'

    AnonymizeRequest:
      type: object
      required: [features]
      properties:
        features:
          type: array
          description: GeoJSON features to anonymize
          items:
            type: object
            additionalProperties: true
        method:
          type: string
          enum: [location_perturbation, spatial_k_anonymity, geographic_masking]
          default: location_perturbation
        parameters:
          type: object
          properties:
            epsilon:
              type: number
              description: Perturbation epsilon (location_perturbation)
              default: 100.0
            k:
              type: integer
              description: Minimum group size (spatial_k_anonymity)
              default: 5
            h3_resolution:
              type: integer
              description: H3 resolution (spatial_k_anonymity)
              default: 9

    AnonymizeResponse:
      type: object
      properties:
        anonymized_data:
          type: object
          description: Anonymized GeoJSON FeatureCollection
          additionalProperties: true
        method:
          type: string
        parameters:
          type: object
          additionalProperties: true

    CheckAccessRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
        longitude:
          type: number

    CheckAccessResponse:
      type: object
      properties:
        has_access:
          type: boolean
        location:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number

    CheckComplianceRequest:
      type: object
      required: [features]
      properties:
        features:
          type: array
          description: GeoJSON features to check
          items:
            type: object
            additionalProperties: true
        regimes:
          type: array
          items:
            type: string
          default: [gdpr]
          description: Compliance regime names (e.g. gdpr)
        data_reference:
          type: string
          default: api_submission

    Violation:
      type: object
      description: Compliance violation detail (ComplianceViolation.to_dict())
      additionalProperties: true

    CheckComplianceResponse:
      type: object
      properties:
        compliant:
          type: boolean
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
        violation_count:
          type: integer
        regimes_checked:
          type: array
          items:
            type: string

    FilterDataRequest:
      type: object
      required: [features]
      properties:
        features:
          type: array
          description: GeoJSON features to filter
          items:
            type: object
            additionalProperties: true

    FilterDataResponse:
      type: object
      properties:
        filtered_data:
          type: object
          description: Filtered GeoJSON FeatureCollection
          additionalProperties: true
        original_count:
          type: integer
        filtered_count:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error summary returned by the API
