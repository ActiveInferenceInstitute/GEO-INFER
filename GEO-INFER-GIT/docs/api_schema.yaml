# GEO-INFER-GIT REST API schema
#
# This OpenAPI 3.0.3 document describes ONLY the endpoints implemented in
# src/geo_infer_git/api/rest_api.py. Planned-but-unimplemented capabilities
# (commit endpoints, workflows, integrations, data versioning, code
# analysis, deployments, system config) are listed under "Planned" at the
# end of this file and MUST NOT be treated as available.

openapi: 3.0.3
info:
  title: GEO-INFER-GIT API
  description: |
    Repository management system for the GEO-INFER framework.

    ## Implemented Capabilities
    - **Repository Management**: List, register, clone, and sync git repositories
    - **Branch Management**: List, create, and merge branches across managed worktrees
    - **System Health**: Health check and system status endpoints

    ## Key Features
    - Multi-platform git repository discovery (filesystem-backed worktrees)
    - Background clone and sync operations
    - Branch protection metadata and merge reporting

    Status filtering on `/repositories` is filesystem-derived: `active` means
    the directory exists with a `.git` folder, `error` the opposite. Repository
    records are process-local in-memory state and are lost on restart.

  version: 1.0.0
  contact:
    name: GEO-INFER Development Team
    url: https://github.com/ActiveInferenceInstitute/GEO-INFER
    email: geo-infer@activeinference.institute
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /repositories:
    get:
      summary: List managed repositories
      description: |
        List repositories managed under the manager base directory.
        `platform`, `organization`, and `language` query parameters are
        accepted but not applied to filesystem-backed discovery.
      tags: [repositories]
      parameters:
        - name: status_filter
          in: query
          schema:
            type: string
            enum: [active, error]
        - name: platform
          in: query
          schema:
            type: string
        - name: organization
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Repository listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  repositories:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        path:
                          type: string
                        exists:
                          type: boolean
                        is_git:
                          type: boolean
                  total:
                    type: integer
        '500':
          description: Internal error
    post:
      summary: Register a managed repository
      tags: [repositories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryRequest'
      responses:
        '201':
          description: Repository registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '400':
          description: Invalid request
        '409':
          description: Repository already registered
        '500':
          description: Internal error

  /repositories/{repo_id}:
    get:
      summary: Get repository details
      tags: [repositories]
      parameters:
        - name: repo_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Repository details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '404':
          description: Repository not found

  /repositories/{repo_id}/clone:
    post:
      summary: Clone a repository
      tags: [repositories]
      parameters:
        - name: repo_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneRequest'
      responses:
        '202':
          description: Clone started in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloneResponse'
        '500':
          description: Error starting clone

  /repositories/{repo_id}/sync:
    post:
      summary: Synchronize a repository
      tags: [repositories]
      parameters:
        - name: repo_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '202':
          description: Sync started in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '500':
          description: Error starting sync

  /repositories/{repo_id}/branches:
    get:
      summary: List branches for a repository
      tags: [branches]
      parameters:
        - name: repo_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Branch listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  branches:
                    type: array
                    items:
                      $ref: '#/components/schemas/BranchInfo'
                  total:
                    type: integer
        '404':
          description: Repository not found
        '500':
          description: Error listing branches
    post:
      summary: Create a branch
      tags: [branches]
      parameters:
        - name: repo_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchRequest'
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '404':
          description: Repository not found
        '409':
          description: Branch already exists
        '500':
          description: Error creating branch

  /repositories/{repo_id}/branches/{branch_name}/merge:
    post:
      summary: Merge a branch
      tags: [branches]
      parameters:
        - name: repo_id
          in: path
          required: true
          schema:
            type: string
        - name: branch_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      responses:
        '200':
          description: Merge result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeResponse'
        '404':
          description: Repository or branch not found
        '500':
          description: Error merging branch

  /health:
    get:
      summary: Health check
      tags: [system]
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /system/status:
    get:
      summary: Detailed system status
      tags: [system]
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'

components:
  schemas:
    RepositoryRequest:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        url:
          type: string
        branch:
          type: string
        description:
          type: string
        clone_enabled:
          type: boolean
          default: true
        auto_sync:
          type: boolean
          default: false
        sync_interval:
          type: integer
          default: 3600

    RepositoryResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        branch:
          type: string
        description:
          type: string
        clone_enabled:
          type: boolean
        auto_sync:
          type: boolean
        sync_interval:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CloneRequest:
      type: object
      properties:
        branch:
          type: string
        depth:
          type: integer
          default: 1
        lfs:
          type: boolean
          default: true

    CloneResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        started_at:
          type: string
          format: date-time
        estimated_completion:
          type: string
          format: date-time
          nullable: true

    SyncRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
        branches:
          type: array
          items:
            type: string
          nullable: true

    SyncResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        started_at:
          type: string
          format: date-time

    BranchRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        protected:
          type: boolean
          default: false

    BranchResponse:
      type: object
      properties:
        name:
          type: string
        created:
          type: boolean
        commit_sha:
          type: string
        protected:
          type: boolean
        repository_id:
          type: string

    BranchInfo:
      type: object
      properties:
        name:
          type: string
        commit_sha:
          type: string
        is_default:
          type: boolean
        ahead:
          type: integer
        behind:
          type: integer

    MergeRequest:
      type: object
      properties:
        strategy:
          type: string
        message:
          type: string
        delete_source:
          type: boolean
          default: false

    MergeResponse:
      type: object
      properties:
        merged:
          type: boolean
        message:
          type: string
        conflicts:
          type: array
          items:
            type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        components:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string

    SystemStatusResponse:
      type: object
      properties:
        status:
          type: string
        uptime_seconds:
          type: number
        total_repositories:
          type: integer
        active_repositories:
          type: integer
        git_version:
          type: string

# Planned (NOT implemented — do not rely on these):
#   /repositories/{id}/commits[/{sha}[/diff]]   - commit history and diffs
#   /workflows, /workflows/{id}/runs             - CI workflow automation
#   /integrations, /integrations/{id}/test       - platform integration hub
#   /data-versioning/datasets[...]               - geospatial data versioning
#   /analysis/repositories/{id}/quality|security - static analysis
#   /deployments, /deployments/{id}/rollback     - deployment pipeline
#   /system/config                               - runtime configuration