name: Import probe portability

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          cache-dependency-glob: uv.lock
      - name: Install standalone probe test tools
        run: python -m pip install pytest==8.4.2 build==1.3.0
      - name: Exercise real source and installed-wheel subprocesses
        # These tooling tests need no geospatial runtime or workspace fixtures.
        # In particular Windows must execute taskkill, not a mocked POSIX path.
        run: >-
          python -m pytest --noconftest -c GEO-INFER-TEST/config/import-probes.ini -q
          GEO-INFER-TEST/tests/unit/test_validate_repo_contracts.py
          GEO-INFER-TEST/tests/unit/test_build_package_wheels.py
          --junitxml=probe-results.xml
      - name: Record platform and revision
        if: always()
        run: python -c "import platform,sys,subprocess,json; print(json.dumps(dict(platform=platform.platform(),python=sys.version,revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())))"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: import-probes-${{ matrix.os }}-${{ matrix.python }}
          path: probe-results.xml
          if-no-files-found: error
          retention-days: 14
