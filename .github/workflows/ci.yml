name: GEO-INFER CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --all-extras || uv sync

      - name: Run code quality checks
        run: |
          uv run ruff check GEO-INFER-*/src/ GEO-INFER-TEST/*.py
          uv run black --check GEO-INFER-*/src/ GEO-INFER-TEST/*.py

      - name: Validate repository contracts
        run: |
          uv run python GEO-INFER-TEST/validate_repo_contracts.py --strict-source-language --skip-import-smoke
          uv run python GEO-INFER-TEST/validate_skills.py --check-xrefs

      - name: Run unit tests
        run: |
          uv run python GEO-INFER-TEST/run_unified_tests.py --category unit

      - name: Run integration tests
        run: |
          uv run python GEO-INFER-TEST/run_unified_tests.py --category integration

      - name: Run H3 contracts
        run: |
          uv run python GEO-INFER-TEST/run_unified_tests.py --h3-migration
