name: GEO-INFER CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          # CuPy requires a CUDA toolchain when no compatible wheel is
          # available; the hosted CPU runners do not provide one. Keep the
          # performance extra available to developers while excluding it from
          # this CPU-only validation environment.
          uv sync --all-extras --no-install-package cupy

      - name: Run code quality checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.py')"
          if [ -z "$changed_files" ]; then
            echo "No Python files changed; skipping code quality checks."
            exit 0
          fi

          echo "Checking changed Python files:"
          printf '%s\n' "$changed_files"
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- '*.py' | \
            xargs -0 uv run --with 'ruff>=0.3.0' --with 'black>=21.9.0' ruff check
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- '*.py' | \
            xargs -0 uv run --with 'ruff>=0.3.0' --with 'black>=21.9.0' black --check

      - name: Validate repository contracts
        run: |
          uv run python GEO-INFER-TEST/validate_repo_contracts.py --strict-source-language --skip-import-smoke
          uv run python GEO-INFER-TEST/validate_skills.py --check-xrefs

      - name: Run unit tests
        run: |
          uv run python GEO-INFER-TEST/run_unified_tests.py --category unit

      - name: Run integration tests
        run: |
          uv run python GEO-INFER-TEST/run_unified_tests.py --category integration

      - name: Run H3 contracts
        run: |
          uv run python GEO-INFER-TEST/run_unified_tests.py --h3-migration
