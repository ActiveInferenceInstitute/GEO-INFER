name: GEO-INFER CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -r requirements.txt || echo "No root requirements"

      - name: Run code quality checks
        run: |
          # Using ruff, black, and mypy for linting and formatting checks
          uv pip install --system ruff black mypy
          ruff check GEO-INFER-*/src/
          black --check GEO-INFER-*/src/

      - name: Run unified tests
        run: |
          uv run python GEO-INFER-TEST/run_unified_tests.py
