name: GEO-INFER CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geo-infer-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # SC-27: 90-minute wall budget (~1.5x observed leg time); the per-category
    # summary in run_unified_tests.py makes a leg approaching its ceiling
    # visible before the job timeout trips.
    timeout-minutes: 90
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            .python-version

      - name: Install locked dependencies
        run: |
          # CuPy requires a CUDA toolchain when no compatible wheel is
          # available; the hosted CPU runners do not provide one. Keep the
          # performance extra available to developers while excluding it from
          # this CPU-only validation environment.
          # Mayavi is an optional Python <3.12 3-D extra whose source build is
          # incompatible with the hosted runner's VTK dependency; no CI test
          # requires that optional backend.
          # Vaex is an optional Python <3.12 performance extra whose C++
          # extension does not build against the hosted runner toolchain.
          uv sync --locked --python "$(command -v python)" --all-packages --all-extras \
            --no-install-package cupy --no-install-package mayavi \
            --no-install-package vaex --no-install-package vaex-core

      - name: Run code quality checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base_sha="$BASE_SHA"
          if ! [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse --verify "$HEAD_SHA^" 2>/dev/null || git hash-object -t tree /dev/null)"
          fi

          # Exclude deleted paths: formatters and linters can only inspect
          # files that exist in the checked-out tree.
          changed_files="$(git diff --name-only --diff-filter=ACMRTUXB "$base_sha" "$HEAD_SHA" -- '*.py')"
          if [ -z "$changed_files" ]; then
            echo "No Python files changed; skipping code quality checks."
            exit 0
          fi

          echo "Checking changed Python files:"
          printf '%s\n' "$changed_files"
          # Keep this gate focused on runtime-invalid constructs. The full
          # source hygiene contract below owns the repository-wide critical
          # rules, while Ruff provides the deterministic formatting gate.
          git diff --name-only -z --diff-filter=ACMRTUXB "$base_sha" "$HEAD_SHA" -- '*.py' | \
            xargs -0 uv run --with 'ruff>=0.15.6,<0.16' ruff check \
              --select F821,F823,E721,E722
          git diff --name-only -z --diff-filter=ACMRTUXB "$base_sha" "$HEAD_SHA" -- '*.py' | \
            xargs -0 uv run --with 'ruff>=0.15.6,<0.16' ruff format --check

      - name: Validate repository contracts
        run: |
          uv run python GEO-INFER-TEST/validate_repo_contracts.py --strict-source-language
          uv run python GEO-INFER-TEST/validate_packaging.py --strict
          uv run python GEO-INFER-TEST/validate_logging_hygiene.py
          uv run python GEO-INFER-TEST/validate_documentation.py --strict
          uv run python GEO-INFER-TEST/validate_skills.py --check-xrefs
          uv run python GEO-INFER-TEST/validate_active_inference_contract.py
          uv run python GEO-INFER-TEST/rewrite_readme_agents.py --check

      - name: Run syntax and strict test contracts
        run: |
          python -m compileall GEO-INFER-*/src GEO-INFER-*/examples
          uv run python GEO-INFER-TEST/validate_test_contracts.py --strict

      - name: Run model contracts and reproducibility audit
        run: |
          uv run python GEO-INFER-TEST/validate_model_contracts.py --strict --seed 42
          uv run python GEO-INFER-TEST/run_model_audit.py --seed 42 --reproducible

      - name: Run source runtime hygiene
        run: |
          uv run --with 'ruff>=0.15.6,<0.16' ruff check \
            GEO-INFER-*/src --select F821,F823,E721,E722
          # HYG-04: the module test suites carry no dead imports or unused
          # locals; sanctioned availability probes are preserved as
          # redundant-alias re-exports, which this rule set does not flag.
          uv run --with 'ruff>=0.15.6,<0.16' ruff check \
            GEO-INFER-*/tests --select F401,F841,F811

      - name: Install pinned gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin --no-same-owner gitleaks
          gitleaks version

      - name: Scan full history for secrets
        # SEC-02: fail-closed scan over the full history with the committed
        # policy; allowlists are file- and rule-scoped with written
        # justifications (GEO-INFER-TEST/docs/secret_scan_policy.md).
        run: |
          gitleaks detect --source . --config .gitleaks.toml --redact --verbose

      - name: Enforce module coverage floors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # TEST-03: modules whose src or tests changed in this event are
          # re-measured and must meet their recorded floor
          # (GEO-INFER-TEST/coverage_baseline.json).
          base_sha="$BASE_SHA"
          if ! [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse --verify "$HEAD_SHA^" 2>/dev/null || echo "$HEAD_SHA")"
          fi
          uv run --with pytest-cov python GEO-INFER-TEST/check_coverage_floor.py \
            --base "$base_sha" --head "$HEAD_SHA"

      - name: Run unit tests
        id: unit_tests
        run: |
          # ACT's real-H3 and visualization unit surface is CPU-bound on the
          # hosted runner; keep the per-module timeout explicit without
          # converting a slow but valid module into a false CI failure.
          uv run python GEO-INFER-TEST/run_unified_tests.py --category unit \
            --timeout 600

      - name: Retain unit test reports
        if: always() && steps.unit_tests.outcome != 'skipped' && steps.unit_tests.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geo-infer-unit-reports-py${{ matrix.python-version }}
          path: .geo-infer-test-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Run integration tests
        id: integration_tests
        run: |
          uv run python GEO-INFER-TEST/run_unified_tests.py --category integration \
            --timeout 600

      - name: Retain integration test reports
        if: always() && steps.integration_tests.outcome != 'skipped' && steps.integration_tests.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geo-infer-integration-reports-py${{ matrix.python-version }}
          path: .geo-infer-test-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Run performance tests
        id: performance_tests
        run: |
          uv run python GEO-INFER-TEST/run_unified_tests.py --category performance \
            --timeout 600

      - name: Run system tests
        id: system_tests
        run: |
          uv run python GEO-INFER-TEST/run_unified_tests.py --category system \
            --timeout 600
      - name: Retain system test reports
        if: always() && steps.system_tests.outcome != 'skipped' && steps.system_tests.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geo-infer-system-reports-py${{ matrix.python-version }}
          path: .geo-infer-test-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Retain performance test reports
        if: always() && steps.performance_tests.outcome != 'skipped' && steps.performance_tests.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geo-infer-performance-reports-py${{ matrix.python-version }}
          path: .geo-infer-test-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Run H3 contracts
        id: h3_contracts
        run: |
          uv run python GEO-INFER-TEST/run_unified_tests.py --h3-migration

      - name: Retain H3 contract reports
        if: always() && steps.h3_contracts.outcome != 'skipped' && steps.h3_contracts.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geo-infer-h3-reports-py${{ matrix.python-version }}
          path: .geo-infer-test-results/summary.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Prune uv cache
        if: always()
        continue-on-error: true
        run: uv cache prune --ci

  manuscript:
    # The manuscript render scans the whole checkout and regenerates figures;
    # it is kept out of the fast test lane so a slow or broken render cannot
    # fail or delay the per-matrix validation jobs.
    runs-on: ubuntu-latest
    # The render stage adds an apt LaTeX toolchain install and a full
    # pandoc + XeLaTeX build to the existing verification run.
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-suffix: manuscript

      - name: Install locked workspace dependencies
        run: |
          uv sync --locked --python "$(command -v python)" --all-packages --all-extras \
            --no-install-package cupy --no-install-package mayavi \
            --no-install-package vaex --no-install-package vaex-core

      - name: Generate research artifacts
        run: |
          uv run python manuscript/generate_research_artifacts.py --verify

      - name: Check published artifacts converge
        # output/ is gitignored: --check runs AFTER regeneration as the
        # shim-style post-condition, failing when the render did not converge.
        run: |
          uv run python manuscript/generate_research_artifacts.py --check
          echo "Manuscript staleness gate (--check): converged" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the LaTeX render toolchain
        # Minimal fail-closed set: xelatex plus the packages the preamble
        # and pandoc's defaults need (seqsplit, fvextra, cleveref,
        # longtable), and poppler for the layout tests' pdftotext and
        # pdfinfo.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern poppler-utils

      - name: Install pinned pandoc and pandoc-crossref
        # pandoc-crossref is built against one pandoc version, so the pair
        # is installed from pinned release tarballs rather than from apt.
        run: |
          curl -fsSL -o /tmp/pandoc.tar.gz \
            https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  /tmp/pandoc.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/pandoc.tar.gz -C /usr/local --strip-components=1 \
            --no-same-owner pandoc-3.11/bin
          curl -fsSL -o /tmp/pandoc-crossref.tar.xz \
            https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.25/pandoc-crossref-Linux-X64.tar.xz
          echo "2319816e3545ee78e44e4a97c2174c72eedf4b51d436b32721b48f43458eb0f6  /tmp/pandoc-crossref.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/pandoc-crossref.tar.xz -C /usr/local/bin --no-same-owner \
            pandoc-crossref
          pandoc --version | head -1
          pandoc-crossref --version | head -1

      - name: Render the manuscript PDF
        # The in-repo render stage ROOT-01 deferred: it hydrates the
        # evidence bundle, combines the published sections, and runs pandoc
        # and XeLaTeX fail-closed. Its artifacts are the receipts the
        # render-dependent tests read.
        run: |
          uv run python scripts/render_manuscript_pdf.py

      - name: Run render-dependent root tests
        run: |
          uv run --with pytest python -m pytest \
            tests/test_manuscript_pdf_layout.py \
            "tests/test_manuscript_paths.py::TestFigurePathLiterals::test_the_combined_document_keeps_the_rewrite_inside_image_targets"

      - name: Retain render receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geo-infer-manuscript-render-receipts
          path: |
            output/pdf/GEO-INFER_combined.pdf
            output/pdf/_combined_manuscript.md
            output/pdf/_combined_manuscript.tex
            output/pdf/_combined_manuscript.log
          if-no-files-found: warn
          retention-days: 14

      - name: Run root manuscript regression tests
        # run_unified_tests.py only enumerates GEO-INFER-* module
        # directories, so the root tests/ suite never ran in CI. These 100+
        # tests guard the generator, its verification record and the
        # shipped-bundle contract. The 7 render-dependent tests (6 in
        # test_manuscript_pdf_layout.py and the deselected paths test) run
        # in this same workflow's manuscript job above, which renders
        # output/pdf/* first; pytest is layered on because the locked env
        # omits it.
        run: |
          uv run --with pytest python -m pytest tests/ \
            --ignore=tests/test_manuscript_pdf_layout.py \
            --deselect "tests/test_manuscript_paths.py::TestFigurePathLiterals::test_the_combined_document_keeps_the_rewrite_inside_image_targets"
