[pytest]
# Ecosystem-wide test collection — all GEO-INFER modules
# Uses rootdir discovery (.) with importlib import mode to avoid conftest collisions
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
importmode = importlib
consider_namespace_packages = false

# Directories to always skip during collection
norecursedirs = 
    .git
    .hypothesis
    .benchmarks
    __pycache__
    node_modules
    .tox
    .eggs
    *.egg-info
    dist
    build
    ~
    .test-results

# Logging configuration during tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)

# Test reporting and visualization
addopts = 
    --verbose
    --color=yes
    --durations=10
    --tb=short
    --continue-on-collection-errors
    --import-mode=importlib

# Test discovery markers
markers = 
    unit: Unit tests that test a specific function or class in isolation
    integration: Integration tests
    system: System tests
    performance: Performance tests
    geospatial: Geospatial tests
    api: Tests related to API functionality
    slow: Tests that take a long time to run
    fast: Tests that run quickly
    temporal: Temporal data tests
    ml: Machine learning tests
    spatial: Spatial analysis tests
    bayesian: Bayesian inference tests
    iot: IoT sensor data tests
    security: Security-related tests
    governance: Governance and policy tests
    health: Health data tests
    climate: Climate and environmental tests
    transport: Transportation and routing tests
    marine: Marine and oceanographic tests
    agricultural: Agricultural data tests
    economic: Economic modeling tests
    forestry: Forestry and wildfire tests
    simulation: Simulation engine tests
    math: Mathematical computation tests