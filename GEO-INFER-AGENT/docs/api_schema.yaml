# GEO-INFER-AGENT OpenAPI schema, regenerated from the live FastAPI app:
#   uv run --no-sync python -c \
#     "from geo_infer_agent.api.agent_endpoints import app; import yaml; \
#      print(yaml.safe_dump(app.openapi()))"
# The ``paths`` and ``components`` blocks below mirror that output verbatim.
# Earlier revisions of this file documented fabricated endpoint groups
# (/active-inference/*, /multi-agent/*, /spatial-reasoning/*, /learning/*,
# /communication/*, /agents/{agentId}/pause); those routes have never existed
# in the app and were removed.
openapi: 3.1.0
info:
  title: GEO-INFER-AGENT API
  description: API for managing autonomous geospatial agents
  version: 0.3.0
  contact:
    name: GEO-INFER Agent Team
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/

servers:
  - url: http://localhost:8000
    description: Local development server (start_api_server default)

paths:
  /agents:
    get:
      description: List all registered agents.
      operationId: list_agents_agents_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                title: Response List Agents Agents Get
                type: array
          description: Successful Response
      summary: List Agents
      tags:
      - Agents
    post:
      description: Create a new agent.
      operationId: create_agent_agents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Agent
      tags:
      - Agents
  /agents/{agent_id}:
    delete:
      description: Delete an agent.
      operationId: delete_agent_agents__agent_id__delete
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Agent
      tags:
      - Agents
    get:
      description: Get agent details.
      operationId: get_agent_agents__agent_id__get
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Agent
      tags:
      - Agents
  /agents/{agent_id}/action:
    post:
      description: Perform an action on an agent.
      operationId: agent_action_agents__agent_id__action_post
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentAction'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Agent Action
      tags:
      - Control
  /agents/{agent_id}/message:
    post:
      description: Send a message from one agent to another.
      operationId: send_message_agents__agent_id__message_post
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessage'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Send Message
      tags:
      - Communication
  /agents/{agent_id}/start:
    post:
      description: Start an agent.
      operationId: start_agent_agents__agent_id__start_post
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Start Agent
      tags:
      - Control
  /agents/{agent_id}/state:
    get:
      description: Get the current state of an agent.
      operationId: get_agent_state_agents__agent_id__state_get
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Agent State
      tags:
      - State
  /agents/{agent_id}/stop:
    post:
      description: Stop an agent.
      operationId: stop_agent_agents__agent_id__stop_post
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          title: Agent Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Stop Agent
      tags:
      - Control

components:
  schemas:
    AgentAction:
      description: Model for triggering an agent action.
      properties:
        action:
          description: Action to perform
          title: Action
          type: string
        parameters:
          additionalProperties: true
          default: {}
          description: Action parameters
          title: Parameters
          type: object
      required:
      - action
      title: AgentAction
      type: object
    AgentCreate:
      description: Model for creating a new agent.
      properties:
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Custom ID for the agent (auto-generated if not provided)
          title: Agent Id
        agent_type:
          description: Type of agent to create
          title: Agent Type
          type: string
        config:
          additionalProperties: true
          default: {}
          description: Agent configuration
          title: Config
          type: object
        region:
          anyOf:
          - type: string
          - type: 'null'
          description: Geospatial region for agent operation (GeoJSON)
          title: Region
      required:
      - agent_type
      title: AgentCreate
      type: object
    AgentMessage:
      description: Model for agent-to-agent messages.
      properties:
        content:
          additionalProperties: true
          description: Message content
          title: Content
          type: object
        to_agent_id:
          description: Target agent ID
          title: To Agent Id
          type: string
      required:
      - to_agent_id
      - content
      title: AgentMessage
      type: object
    AgentResponse:
      description: Standard response model for agent operations.
      properties:
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Response data
          title: Data
        message:
          description: Human-readable message
          title: Message
          type: string
        success:
          description: Whether the operation was successful
          title: Success
          type: boolean
      required:
      - success
      - message
      title: AgentResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object

tags:
  - name: Agents
    description: Agent lifecycle management (list, create, inspect, delete)
  - name: Control
    description: Agent execution control (start, stop, actions)
  - name: State
    description: Agent state inspection
  - name: Communication
    description: Inter-agent messaging