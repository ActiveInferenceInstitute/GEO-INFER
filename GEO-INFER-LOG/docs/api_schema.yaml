openapi: 3.0.3
info:
  title: GEO-INFER-LOG API
  description: |
    Logistics optimization API for geospatial intelligence systems.

    The API exposes the module's four real FastAPI routers (see
    `src/geo_infer_log/api/`):

    - `/routes` — route optimization, fleet management, VRP
    - `/delivery` — last-mile delivery, scheduling, service areas
    - `/transport` — multimodal planning, network analysis, traffic, emissions
    - `/supply-chain` — network design, flow optimization, resilience,
      facility location

    All stateful services (fleet, networks, schedules) are held as
    process-level singletons, so state created by one request is visible
    to subsequent requests.
  version: 0.2.0
  contact:
    name: GEO-INFER Development Team
    email: geo-infer@activeinference.institute
  license:
    name: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: routes
    description: Route optimization and fleet management
  - name: delivery
    description: Last-mile delivery and scheduling
  - name: transport
    description: Multimodal transportation and emissions
  - name: supply-chain
    description: Supply chain network design and resilience

paths:
  /routes/optimize:
    post:
      tags: [routes]
      summary: Optimize a route between two points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin, destination]
              properties:
                origin:
                  type: array
                  items: {type: number}
                  description: (lon, lat)
                destination:
                  type: array
                  items: {type: number}
                  description: (lon, lat)
                waypoints:
                  type: array
                  items:
                    type: array
                    items: {type: number}
                parameters:
                  $ref: '#/components/schemas/RoutingParameters'
      responses:
        '200':
          description: Route with path, distance (km), travel_time (min), geometry
        '400':
          $ref: '#/components/responses/BadRequest'

  /routes/vehicles:
    post:
      tags: [routes]
      summary: Register a vehicle with the (persistent) fleet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle]
              properties:
                vehicle:
                  $ref: '#/components/schemas/Vehicle'
      responses:
        '200':
          description: Registration status
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [routes]
      summary: List all registered vehicles
      responses:
        '200':
          description: Registered vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'

  /routes/vrp:
    post:
      tags: [routes]
      summary: Solve a vehicle routing problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deliveries, depots, vehicles]
              properties:
                deliveries:
                  type: array
                  items:
                    type: object
                depots:
                  type: array
                  items:
                    type: array
                    items: {type: number}
                vehicles:
                  type: array
                  items:
                    $ref: '#/components/schemas/Vehicle'
                constraints:
                  type: object
      responses:
        '200':
          description: VRP solution (routes per vehicle, unassigned list)
        '400':
          $ref: '#/components/responses/BadRequest'

  /delivery/optimize:
    post:
      tags: [delivery]
      summary: Optimize last-mile deliveries from a depot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                depot:
                  $ref: '#/components/schemas/Location'
                deliveries:
                  type: array
                  items:
                    $ref: '#/components/schemas/Location'
                vehicles:
                  type: array
                  items:
                    $ref: '#/components/schemas/Vehicle'
                constraints:
                  type: object
      responses:
        '200':
          description: Optimized routes
        '400':
          $ref: '#/components/responses/BadRequest'

  /delivery/schedule:
    post:
      tags: [delivery]
      summary: Create a delivery schedule for a date range
      responses:
        '200':
          description: Schedule summary
        '400':
          $ref: '#/components/responses/BadRequest'

  /delivery/schedule/{date}:
    get:
      tags: [delivery]
      summary: Get the delivery schedule for a specific day
      parameters:
        - name: date
          in: path
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: Routes scheduled for the day
        '400':
          $ref: '#/components/responses/BadRequest'

  /delivery/service-area:
    post:
      tags: [delivery]
      summary: Define a service area around a depot
      responses:
        '200':
          description: Service area geometry
        '400':
          $ref: '#/components/responses/BadRequest'

  /transport/route:
    post:
      tags: [transport]
      summary: Plan a multimodal route
      responses:
        '200':
          description: Multimodal route segments
        '400':
          $ref: '#/components/responses/BadRequest'

  /transport/compare-routes:
    post:
      tags: [transport]
      summary: Compare multimodal route options
      responses:
        '200':
          description: Comparison records
        '400':
          $ref: '#/components/responses/BadRequest'

  /transport/network/metrics:
    post:
      tags: [transport]
      summary: Calculate metrics for a loaded transportation network
      responses:
        '200':
          description: Network metrics
        '400':
          $ref: '#/components/responses/BadRequest'

  /transport/traffic/simulate:
    post:
      tags: [transport]
      summary: Simulate traffic for a route
      responses:
        '200':
          description: Simulation results
        '400':
          $ref: '#/components/responses/BadRequest'

  /transport/emissions/calculate:
    post:
      tags: [transport]
      summary: Calculate emissions for a route with a specific vehicle
      responses:
        '200':
          description: Emissions in kg CO2e
        '400':
          $ref: '#/components/responses/BadRequest'

  /supply-chain/networks:
    post:
      tags: [supply-chain]
      summary: Create (load) a supply chain network on the persistent model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [network]
              properties:
                network:
                  $ref: '#/components/schemas/SupplyChainNetwork'
      responses:
        '200':
          description: Network creation status
        '400':
          $ref: '#/components/responses/BadRequest'

  /supply-chain/flow:
    post:
      tags: [supply-chain]
      summary: Optimize flow in the previously created network
      responses:
        '200':
          description: Optimized flows
        '400':
          $ref: '#/components/responses/BadRequest'

  /supply-chain/resilience/disruption:
    post:
      tags: [supply-chain]
      summary: Analyze the impact of a disruption
      responses:
        '200':
          description: Disruption impact analysis
        '400':
          $ref: '#/components/responses/BadRequest'

  /supply-chain/facility-location:
    post:
      tags: [supply-chain]
      summary: Optimize facility locations (p-median)
      responses:
        '200':
          description: Selected facility locations
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  responses:
    BadRequest:
      description: Invalid request or unsatisfied precondition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    RoutingParameters:
      type: object
      properties:
        weight_factor:
          type: string
          enum: [time, distance, cost, emissions]
          default: time
        avoid_highways: {type: boolean, default: false}
        avoid_tolls: {type: boolean, default: false}
        avoid_ferries: {type: boolean, default: false}
        traffic_model:
          type: string
          enum: [best_guess, optimistic, pessimistic]
          default: best_guess
        departure_time: {type: string, format: date-time, nullable: true}

    Vehicle:
      type: object
      required: [id, type, capacity, max_range, speed, cost_per_km, emissions_per_km, location]
      properties:
        id: {type: string}
        type:
          type: string
          enum: [truck, van, car, bike, drone, train, ship, airplane]
        capacity: {type: number, description: Cargo capacity in kg or m3}
        max_range: {type: number, description: Maximum range in km}
        speed: {type: number, description: Average speed in km/h}
        cost_per_km: {type: number}
        emissions_per_km: {type: number, description: kg CO2e per km}
        location:
          type: array
          items: {type: number}
          description: (lon, lat)
        fuel_type:
          type: string
          enum: [diesel, gasoline, electric, hybrid, hydrogen, lng, cng, jet_fuel]
          default: diesel
        available: {type: boolean, default: true}

    Location:
      type: object
      required: [name, coordinates, type]
      properties:
        name: {type: string}
        coordinates:
          type: array
          items: {type: number}
          description: (lon, lat)
        address: {type: string, nullable: true}
        type: {type: string, description: depot, customer, supplier, ...}

    SupplyChainNetwork:
      type: object
      required: [id, name, facilities, links]
      properties:
        id: {type: string}
        name: {type: string}
        facilities:
          type: array
          items:
            $ref: '#/components/schemas/FacilityLocation'
        links:
          type: array
          items:
            type: object
            properties:
              from: {type: string}
              to: {type: string}
              distance: {type: number}
              time: {type: number}
              cost: {type: number}
              capacity: {type: number}

    FacilityLocation:
      type: object
      required: [id, name, location, type]
      properties:
        id: {type: string}
        name: {type: string}
        location:
          type: array
          items: {type: number}
          description: (lon, lat)
        type: {type: string}
        capacity: {type: number}
        operating_cost: {type: number}

    Error:
      type: object
      properties:
        detail: {type: string}
